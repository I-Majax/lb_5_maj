<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task_1</title>
    <style>
        * {
            font-size: 80px;
        }
        .progress-bar{
            height: 35px;
            width: 600px;
            margin: 150px auto;
            border: 1px solid gray;
        }
        .progress-fill{
            height: 100%;
            width: 15%;
            background-color: #28a745;
            position: relative;
            animation-name: anim;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }
        @keyframes anim {
            from {
                left: -30%;
            }
            to{
                left: 120%;
            }
        }
        .white-1{
            background-color: white;
            color: white;
            height: 150px;
            width: 400px;
            position: absolute;
            top: 130px;
            left: 65px;
        }
        .white-2{
            background-color: white;
            color: white;
            height: 150px;
            width: 400px;
            position: absolute;
            top: 130px;
            right: 63px;
        }
    </style>
</head>
<body>
    <div class="progress-bar">
        <div class="progress-fill"></div>
    </div>
    <div class="white-1"></div>
    <div class="white-2"></div>
</body>
</html>
